name: WakaTime Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: athul/waka-readme@v0.2.0r
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          API_BASE_URL: https://c.oling.dev/api
          SHOW_TOTAL: true
          SHOW_TIME: true
          COMMIT_MESSAGE: "chore: update dev metrics" 
